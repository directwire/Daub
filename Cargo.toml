[package]
name = "daub"
version = "0.1.0"
edition = "2021"
description = "Headless calibrated-brush renderer: paints stroke plans at sub-second speed, writes PNG and layered .kra/.psd"

[lib]
name = "daub"
path = "src/lib.rs"
# cdylib 出 .wasm 工件（wasm-bindgen 后处理）；rlib 供 native 测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
png = "0.17"
anyhow = "1"
lzf-rust = "0.1.0"
# kra 打包只需 Stored+Deflated；关默认特性剪掉 zstd/bzip2 等
# C 依赖链（zstd-sys 需 clang，wasm32 编译死点），Deflated=纯 rust miniz
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
miniz_oxide = "0.8"

# wasm-bindgen 只进 wasm 目标，native 依赖树零变化
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
